# ============================================================================
#  Prometheus Configuration — EquiVision
#  Scrapes metrics from FastAPI, Node Exporter, and cAdvisor
# ============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI Backend — app metrics (requires prometheus-fastapi-instrumentator)
  - job_name: "equivision-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "backend"

  # Node Exporter — host system metrics (CPU, RAM, Disk)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # cAdvisor — Docker container metrics
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
