# ============================================================================
#  Grafana Dashboard Provider — Auto-loads dashboards from JSON files
# ============================================================================

apiVersion: 1

providers:
  - name: "EquiVision"
    orgId: 1
    folder: "EquiVision"
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
